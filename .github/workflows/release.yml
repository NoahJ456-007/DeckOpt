# Builds the static `deckopt` binaries and attaches them to a GitHub Release whenever a version tag
# (v2.0.0, v2.1.3, ...) is pushed. install.sh downloads `deckopt-<arch>-unknown-linux-musl` and its
# `.sha256` from the latest release; the aarch64 build is for the Lima test VM.
#
#   git tag v2.0.0 && git push origin v2.0.0

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -e
          asset=deckopt-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/deckopt "$asset"
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"
          ls -la "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: deckopt-${{ matrix.target }}
          path: |
            deckopt-${{ matrix.target }}
            deckopt-${{ matrix.target }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deckopt-x86_64-unknown-linux-musl
            dist/deckopt-x86_64-unknown-linux-musl.sha256
            dist/deckopt-aarch64-unknown-linux-musl
            dist/deckopt-aarch64-unknown-linux-musl.sha256
          generate_release_notes: true
