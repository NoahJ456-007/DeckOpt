# DeckOpt profiles
#
# Settings you can use in any profile table:
#   tdp       = 3..15            watts for the whole APU (with auto_tdp, the most it may use)
#   auto_tdp  = true | false     watch GPU/CPU load and use the lowest power limit the game still runs
#                                smoothly at; learned and remembered per game, power source and screen
#   gpu_mhz   = "auto" | 200..1600   lock the GPU clock (auto = let the driver decide)
#   fps       = 0 | number | "auto" | "refresh" | "half"   frame cap (0 = unlimited, "refresh" = match the screen)
#                "auto" = the highest cap up to max_fps that the screen's refresh rate divides evenly
#                (60Hz TV -> 60, 144Hz monitor -> 48, 165Hz -> 55). On a TV or monitor, a number
#                is also nudged to an even fit when one is close (40 on a 144Hz monitor -> 36)
#   max_fps   = number            ceiling for fps = "auto" (default 60)
#   adaptive_fps = true | false  start at the fps cap and, if the game can't hold it, step down to the next
#                                evenly paced cap (60 -> 45 -> 40 -> 30 built-in, 60 -> 30 on a 60Hz TV);
#                                step back up when it runs comfortably. Measures real frame times
#                                (gamescope 3.16.20+) and remembers where each game settles
#   (refresh rate: Game Mode sets the built-in screen to the highest rate the fps cap divides evenly,
#    e.g. 40fps -> 80Hz and 60fps -> 60Hz on the OLED, just like Steam's own framerate slider)
#   smt       = true | false     CPU hyperthreading
#   cpu_boost = true | false     CPU turbo boost
#   cpu_epp   = "power" | "balance_power" | "balance_performance" | "performance"
#                                how eagerly the CPU clocks up (SteamOS 3.7.5+)
#   vrr       = true | false     adaptive sync on TVs/monitors that support it: frames show the moment
#                                they're ready (less lag, no stutter). Leave unset to keep Steam's setting
#   allow_tearing = true | false lowest possible lag, but visible tear lines. Off unless you turn it on
#
# Any profile table can have sub-tables for conditions:
#   .battery / .ac               power source
#   .internal / .external        built-in screen vs. any monitor/TV
#   .tv / .monitor               which kind of external screen (TVs: "TV" in the name, 80cm+ wide,
#                                or HDMI data with no fixed size, e.g. projectors)
#   .deck / .controller / .kbm   what you're playing with: the Deck's own controls, a controller,
#                                or keyboard and mouse (whichever was used last; ."ac+kbm" etc. work too)
#
# [controller."..."] tables apply while that controller is in use, matched by any part of its name or by
# its vendor id ("3537" = GameSir, "045e" = Microsoft, "054c" = Sony). DeckOpt Check shows the name.
#   ."battery+internal" etc.     both at once
#   .low_battery                 on battery and below low_battery_percent
#
# Layers apply in this order, later ones win:
#   profile -> display."<screen>" -> game."<id or name>" -> profile.low_battery -> game.<..>.low_battery
#
# [graphics."<AppId>"] tables go one step further and edit the game's OWN graphics settings file (see the
# end of this file). Those have the same .battery/.ac/.tv/... sub-tables, each with a `values` table.
#
# This file only needs what you want to change: DeckOpt's built-in profiles (which updates add to)
# sit underneath it, and anything set here wins.
#
# Run `deckopt status` while a game is running to see its AppId, your screen's name,
# and exactly which layers were used. Edits are picked up live, no restart needed.

[settings]
poll_seconds = 3
settle_seconds = 8
low_battery_percent = 20
user = "deck"
gamescope_display = ":0"
memory_tweaks = true     # CryoUtilities' recommended memory settings; originals restored if DeckOpt stops
fast_controller_polling = true  # wired PlayStation/generic USB pads: 1000Hz instead of 125-250Hz
                                # (re-plug the controller once). Xbox-style pads are already fast
keep_controllers_awake = true  # turn off USB power saving for wireless controller dongles, a common
                               # cause of controllers disconnecting and reconnecting over and over
docked_charge_limit = 0  # e.g. 80: stop charging at 80% while docked (TV/monitor + charger) to spare the
                         # battery; your normal limit comes back when you undock. 0 = off

# ---------------------------------------------------------------- every game

[profile]
tdp = 15
gpu_mhz = "auto"
fps = "refresh"
refresh = "max"
smt = true
cpu_boost = true
cpu_epp = "balance_performance"

[profile.ac]               # on the charger: aim for 60, settle lower only if the game can't keep up
fps = 60
adaptive_fps = true

[profile.battery]
tdp = 10                 # with auto_tdp this is the ceiling; light games settle lower on their own
auto_tdp = true
cpu_epp = "balance_power"
fps = 40
refresh = "fps"          # 40fps @ 40Hz feels much smoother than 40fps @ 60Hz

[profile."battery+external"]   # e.g. a portable monitor running off the Deck
tdp = 11
fps = 30

[profile.external]
fps = "auto"             # fit the cap to the monitor/TV's refresh rate so frames are evenly paced
vrr = true               # adaptive sync if the TV/monitor supports it: less lag, smoother

# [profile.tv]           # e.g. prefer a steady 30 on every TV, or the lowest possible lag:
# fps = 30
# allow_tearing = true

# [controller."3537"]     # e.g. a GameSir (vendor 3537) on the TV: steady 30 in heavy games
# fps = 30
#
# [profile.monitor]      # e.g. let light games go higher on a high-refresh monitor
# max_fps = 90

[profile.low_battery]
tdp = 7
fps = 30
cpu_boost = false
cpu_epp = "power"

[profile."ac+kbm"]       # keyboard and mouse on the charger: favour responsiveness over even pacing
fps = "refresh"          # run up to the screen's refresh rate (144 on a 144Hz monitor)

# [profile.controller]   # e.g. couch play on a TV with a controller
# fps = 30

# ---------------------------------------------------------------- specific screens
# Name comes from the screen's EDID; `deckopt status` shows it.

# [display."LG TV SSCR2"]
# fps = 60
#
# [display."DELL S2721DGF"]   # 165Hz monitor: the Deck can't hold that, cap at 60
# fps = 60

# ---------------------------------------------------------------- per-game
# Key by Steam AppId (most reliable) or by the game's name.

[game.1145360]           # Hades: light, can hold 60 on very little power
tdp = 9
[game.1145360.battery]
tdp = 6
fps = 60
refresh = "max"

[game.413150]            # Stardew Valley: barely uses anything
tdp = 5
smt = false
[game.413150.battery]
tdp = 4
fps = 60
refresh = "max"

[game.1245620]           # Elden Ring: heavy; on the charger adaptive FPS finds the level it can hold
[game.1245620.battery]
tdp = 13
fps = 30
[game.1245620.external]
fps = 30

[game.1091500]           # Cyberpunk 2077: needs full power everywhere; adaptive FPS on the charger
[game.1091500.battery]
tdp = 15
fps = 30
[game.1091500.external]
fps = 30

[game.105600]            # Terraria: the game itself runs at a fixed 60fps
fps = 60
refresh = "fps"          # 60Hz on the OLED; 90Hz would judder
tdp = 9
[game.105600.battery]
tdp = 6
[game.105600.external]
fps = 60

[game.268910]            # Cuphead: fixed 60fps 2D, light
fps = 60
refresh = "fps"
tdp = 9
[game.268910.battery]
tdp = 6
[game.268910.external]
fps = 60

[game.2694490]           # Path of Exile 2: heavy; full power and a steady 30 on battery, adaptive on the charger
[game.2694490.battery]   # (TV included: aims for 60, steps down only if it can't hold it).
tdp = 15                 # Its own graphics settings are turned down too, see [graphics."2694490"] below.
fps = 30

# ---------------------------------------------------------------- in-game graphics settings
# A [graphics."<AppId>"] rule edits the game's own settings file so the game itself runs lighter, on top of
# the system tuning above. The values are written while the game is NOT running (games read their settings
# at startup and save them on exit): right after it quits, when the charger or screen changes with no game
# open, and when DeckOpt starts. So what's in the file is always for the NEXT launch, chosen for the state at
# that moment: unplug the Deck while playing and the low settings arrive when you next start the game.
# Changing one of these settings in the game's own menu only lasts until the game quits; to keep your choice,
# set it here instead or drop the key from your copy of the rule.
#
#   file    = "<path>" or ["<path>", ...]   relative to the game's Proton prefix user folder
#             (…/compatdata/<AppId>/pfx/drive_c/users/steamuser), or to the install folder with root = "install".
#             May contain * wildcards; it must match exactly one file. Several paths = try each.
#   format  = "ini"                         (the only format so far)
#   preset  = "unreal"                      start from a built-in template (see [graphics.unreal])
#   values.<SECTION>.<key> = value          what to set; .battery/.ac/.tv/.monitor/.internal/.external/
#                                           .deck/.controller/.kbm/."ac+tv"… sub-tables override, later wins
#
# Only keys the game has already written are changed, byte for byte otherwise (encoding, line endings,
# comments and order are kept). Keys that aren't in the file are skipped and listed by DeckOpt Check.
# The untouched original is kept in /var/lib/deckopt/graphics-backup and put back by "DeckOpt On-Off" (off)
# and by uninstalling, not on every service stop.

[graphics."2694490"]     # Path of Exile 2: poe2_production_Config.ini only exists after the first launch.
file = ["Documents/My Games/Path of Exile 2/poe2_production_Config.ini",
        "My Documents/My Games/Path of Exile 2/poe2_production_Config.ini"]  # older Proton prefixes
# Key names and values come from real poe2_production_Config.ini dumps, not from memory:
#   github.com/Lailloken/Exile-UI/issues/717 (Jan 2026), github.com/doitsujin/dxvk/issues/4530 (Dec 2024),
#   pathofexile.com/forum/view-thread/3750303 (Apr 2025), /view-thread/3828771 (Aug 2025),
#   /view-thread/3885340 (TextureQualityMedium); the prefix path from github.com/ValveSoftware/Proton/issues/8296.
# Seen values: shadow_type High/Low; light_quality 0/2 ("number of lights"); global_illumination_detail 0;
#   water_detail 0/1; texture_quality TextureQualityLow/Medium/High; texture_filtering 2/8/16 (anisotropic);
#   upscale_quality Quality/Balanced/Performance; vsync Adaptive/Off; dynamic_resolution_fps 30..120.
# Not set on purpose: resolution and upscale mode (Game Mode handles the screen), renderer, HDR, brightness.
[graphics."2694490".values.DISPLAY]        # every state: performance first
shadow_type = "Low"
light_quality = 0
global_illumination_detail = 0           # lighting = shadows only, no GI
use_dynamic_particle_culling2 = true     # "dynamic culling": drops off-screen/far particle effects
use_dynamic_resolution = true            # render lower when the frame rate drops below the target
vsync = "Off"                            # Game Mode syncs frames itself
framerate_limit_enabled = true
background_framerate_limit_enabled = true
background_framerate_limit = 30
[graphics."2694490".battery.values.DISPLAY]   # lowest: steady 30fps and battery life
texture_quality = "TextureQualityLow"
texture_filtering = 2
water_detail = 0
dynamic_resolution_fps = 30
framerate_limit = 30
upscale_quality = "Performance"
[graphics."2694490".ac.values.DISPLAY]        # charger (TV, monitor or built-in): a little nicer, still light
texture_quality = "TextureQualityMedium"
texture_filtering = 8
water_detail = 1
dynamic_resolution_fps = 40
framerate_limit = 60
upscale_quality = "Balanced"

# Template for Unreal Engine games: their GameUserSettings.ini keeps the quality sliders as sg.* keys, 0 = low,
# 1 = medium, 2 = high, 3 = epic. Only used by games that opt in, e.g.
#   [graphics."1234567"]
#   preset = "unreal"
# (your own values tables override the template's). Only keys the game has already written are changed.
[graphics.unreal]
file = "AppData/Local/*/Saved/Config/Windows*/GameUserSettings.ini"
[graphics.unreal.values.ScalabilityGroups]
"sg.ShadowQuality" = 0
"sg.GlobalIlluminationQuality" = 0
"sg.ReflectionQuality" = 0
"sg.PostProcessQuality" = 1
"sg.EffectsQuality" = 1
"sg.FoliageQuality" = 1
"sg.ShadingQuality" = 1
"sg.ViewDistanceQuality" = 1
"sg.TextureQuality" = 1
"sg.AntiAliasingQuality" = 1
[graphics.unreal.battery.values.ScalabilityGroups]
"sg.PostProcessQuality" = 0
"sg.EffectsQuality" = 0
"sg.FoliageQuality" = 0
"sg.ShadingQuality" = 0
"sg.TextureQuality" = 0
